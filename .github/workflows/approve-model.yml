name: Approve Model Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-model:
    if: github.event.label.name == 'approved' || github.event.label.name == 'update-approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue and write model file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const isUpdate = context.payload.label.name === 'update-approved';
            const action = isUpdate ? 'update' : 'add';
            const body = context.payload.issue.body || '';
            const match = body.match(/```(?:json)?\s*\n([\s\S]*?)\n\s*```/);

            if (!match) {
              core.setFailed('Could not find a JSON code block in the issue body.');
              return;
            }

            let model;
            try {
              model = JSON.parse(match[1].trim());
            } catch (error) {
              core.setFailed(`Invalid JSON in issue body: ${error.message}`);
              return;
            }

            const required = [
              'id',
              'modelName',
              'organisation',
              'modelStatus',
              'aiTask',
              'inputSpecification',
              'outputSpecification',
              'architecture',
              'trainingDataOrigin',
              'primaryPerformanceMetric',
              'license',
              'accessLink',
              'moreInformation'
            ];

            for (const field of required) {
              if (typeof model[field] !== 'string' || !model[field].trim()) {
                core.setFailed(`Missing or empty required field: ${field}`);
                return;
              }
            }

            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/i.test(model.id)) {
              core.setFailed('Invalid id. Use only letters, numbers, and hyphens.');
              return;
            }

            if (!/^https?:\/\//i.test(model.accessLink) && model.accessLink.toLowerCase() !== 'n/a') {
              core.setFailed('accessLink must start with http:// or https://, or be N/A.');
              return;
            }

            const modelsDir = path.join(process.cwd(), 'data', 'models');
            const filePath = path.join(modelsDir, `${model.id}.json`);
            const exists = fs.existsSync(filePath);

            if (isUpdate && !exists) {
              core.setFailed(`Cannot update: ${filePath} does not exist.`);
              return;
            }

            if (!isUpdate && exists) {
              core.setFailed(`Cannot add: ${filePath} already exists. Use the update-approved label instead.`);
              return;
            }

            fs.mkdirSync(modelsDir, { recursive: true });
            fs.writeFileSync(filePath, JSON.stringify(model, null, 2) + '\n', 'utf8');

            core.exportVariable('MODEL_ID', model.id);
            core.exportVariable('MODEL_NAME', model.modelName);
            core.exportVariable('ACTION_KIND', action);
            core.exportVariable('ISSUE_NUMBER', String(context.payload.issue.number));

      - name: Validate model files
        run: npm run validate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/
          if [ "$ACTION_KIND" = "update" ]; then
            git commit -m "Update model: ${MODEL_NAME} (closes #${ISSUE_NUMBER})"
          else
            git commit -m "Add model: ${MODEL_NAME} (closes #${ISSUE_NUMBER})"
          fi
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const actionKind = process.env.ACTION_KIND;
            const modelName = process.env.MODEL_NAME;
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const message = actionKind === 'update'
              ? `✏️ **Model updated.**\n\nThe model **${modelName}** has been written to \`data/models/\` and the issue is now closed.`
              : `✅ **Model approved and added.**\n\nThe model **${modelName}** has been written to \`data/models/\` and the issue is now closed.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: message
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
