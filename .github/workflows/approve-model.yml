name: Approve Model Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-model:
    if: |
      github.event.label.name == 'approved' ||
      github.event.label.name == 'update-approved' ||
      github.event.label.name == 'delete-approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse issue and write or delete model file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const label = context.payload.label.name;
            const action = label === 'update-approved' ? 'update'
              : label === 'delete-approved' ? 'delete'
              : 'add';
            core.info(`Mode: ${action}`);

            const body = context.payload.issue.body || '';
            const modelsDir = 'data/models';

            if (action === 'delete') {
              const idMatch = body.match(/Model ID:\s*`?([a-z0-9-]+)`?/i);

              if (!idMatch) {
                core.setFailed('Could not find a "Model ID: <id>" line in the issue body.');
                return;
              }

              const modelId = idMatch[1].trim();
              const filePath = path.join(modelsDir, `${modelId}.json`);

              if (!fs.existsSync(filePath)) {
                core.setFailed(`Cannot delete: file ${filePath} does not exist.`);
                return;
              }

              // Read the name before deleting, for the closing comment.
              let modelName = modelId;
              try {
                modelName = JSON.parse(fs.readFileSync(filePath, 'utf8')).modelName || modelId;
              } catch (e) {
                core.warning(`Could not read ${filePath} before deleting: ${e.message}`);
              }

              fs.rmSync(filePath);
              core.info(`Deleted ${filePath}`);

              core.exportVariable('MODEL_NAME', modelName);
              core.exportVariable('MODEL_ID', modelId);
              core.exportVariable('ISSUE_NUMBER', String(context.payload.issue.number));
              core.exportVariable('ACTION', action);
              return;
            }

            const match = body.match(/```(?:json)?\s*\n([\s\S]*?)\n\s*```/);

            if (!match) {
              core.setFailed('Could not find a JSON code block in the issue body.');
              return;
            }

            let model;
            try {
              model = JSON.parse(match[1].trim());
            } catch (e) {
              core.setFailed(`Invalid JSON in issue body: ${e.message}`);
              return;
            }

            if (!model.id || !model.modelName) {
              core.setFailed('JSON must contain at least "id" and "modelName" fields.');
              return;
            }

            core.info(`Parsed model: ${model.modelName} (${model.id})`);

            const filePath = path.join(modelsDir, `${model.id}.json`);
            const fileExists = fs.existsSync(filePath);
            const isUpdate = action === 'update';

            if (isUpdate && !fileExists) {
              core.setFailed(`Cannot update: file ${filePath} does not exist.`);
              return;
            }

            if (!isUpdate && fileExists) {
              core.setFailed(`Cannot add: file ${filePath} already exists. Use "update-approved" label instead.`);
              return;
            }

            // Set automatically, never trusted from the submitted JSON — this
            // is what keeps "last updated" accurate without relying on
            // submitters to fill it in themselves.
            model.lastUpdated = new Date().toISOString();

            fs.mkdirSync(modelsDir, { recursive: true });
            fs.writeFileSync(filePath, JSON.stringify(model, null, 2) + '\n', 'utf8');

            core.info(`Wrote ${filePath}`);

            core.exportVariable('MODEL_NAME', model.modelName);
            core.exportVariable('MODEL_ID', model.id);
            core.exportVariable('ISSUE_NUMBER', String(context.payload.issue.number));
            core.exportVariable('ACTION', action);

      - name: Validate models
        if: env.ACTION != 'delete'
        run: npm run validate

      - name: Rebuild aggregate index
        run: npm run build-index

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models/ data/models.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          case "$ACTION" in
            update) MSG="Update model: ${MODEL_NAME} (closes #${ISSUE_NUMBER})" ;;
            delete) MSG="Delete model: ${MODEL_NAME} (closes #${ISSUE_NUMBER})" ;;
            *) MSG="Add model: ${MODEL_NAME} (closes #${ISSUE_NUMBER})" ;;
          esac
          git commit -m "$MSG"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        env:
          ACTION: ${{ env.ACTION }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const action = process.env.ACTION;
            const modelName = process.env.MODEL_NAME;

            const verb = action === 'update' ? 'updated in'
              : action === 'delete' ? 'removed from'
              : 'added to';
            const emoji = action === 'update' ? '✏️' : action === 'delete' ? '🗑️' : '✅';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `${emoji} **Model ${action}d!**\n\nThe model **${modelName}** has been ${verb} the registry.`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
