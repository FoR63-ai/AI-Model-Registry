<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Model Detail</title>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --text:#18212f; --muted:#5c6b80; --line:#dbe2ea; --accent:#1d4ed8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.04); padding:24px; }
    .back { display:inline-block; margin-bottom:16px; color:var(--accent); text-decoration:none; }
    h1 { margin:0 0 6px; }
    .meta { color:var(--muted); margin-bottom:22px; }
    dl { margin:0; }
    dt { font-weight:700; margin-top:16px; }
    dd { margin:6px 0 0; line-height:1.55; white-space:pre-wrap; }
    pre { padding:14px; border-radius:12px; background:#0f172a; color:#e5eefc; overflow:auto; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">← Back to index</a>
    <section class="card">
      <div id="app">Loading…</div>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
