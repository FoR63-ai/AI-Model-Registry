<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Model Detail</title>
  <style>
    :root { --bg:#f1f7f3; --card:#fff; --line:#e7efe9; --muted:#5f6f66; --text:#17211c; --badge:#eef5f0; }
    * { box-sizing:border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
    .wrapper { padding: 40px 20px; display: flex; justify-content: center; }
    .card { background: var(--card); width: 100%; max-width: 1100px; padding: 30px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); position: relative; }
    .logo { position: absolute; top: 20px; right: 25px; height: 65px; width: auto; }
    .topbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .left-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    h1 { margin: 0 0 6px 0; padding-right: 130px; }
    .muted { color: var(--muted); font-size: 13px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 8px; background: var(--badge); font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: 260px 1fr; gap: 12px; margin-top: 18px; }
    .label { color: var(--muted); font-size: 13px; }
    .value { white-space: pre-wrap; line-height: 1.4; }
    hr { border: none; border-top: 1px solid #eee; margin: 22px 0; }
    a { text-decoration: none; color: #2f6f4f; }
    a:hover { text-decoration: underline; }
    code { background: #f6f6f6; padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    pre { font-size: 12px; background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; white-space: pre-wrap; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } h1 { padding-right: 0; } .logo { position: static; display: block; margin-left: auto; margin-bottom: 12px; } }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <a href="https://www.eurosdr.net/" target="_blank" rel="noopener noreferrer">
        <img src="EuroSDR.png" alt="EuroSDR logo" class="logo" />
      </a>
      <div class="topbar">
        <div class="left-actions"><a href="index.html">← Back to index</a></div>
        <div class="muted" id="metaHint"></div>
      </div>
      <div id="app"><div class="muted">Loading...</div></div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="data/generated/models.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
