<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Model Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f7f2ea;
      --surface: #fbf7ef;
      --ink: #241f18;
      --text: #2b2620;
      --muted: #6b5f4d;
      --muted-2: #8a7a5f;
      --border: #e2d5bc;
      --border-soft: #ece2cd;
      --accent: #a24a2b;
      --accent-hover: #7c3a20;
      --status-default-bg: #efe6d6;
      --status-default-text: #6b5f4d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Public Sans', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 32px 72px;
    }

    header.site {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      height: 30px;
      width: auto;
    }

    .brand-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .brand-tag {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    a {
      text-decoration: none;
      color: var(--accent);
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 14px;
    }

    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 600;
      font-size: 34px;
      line-height: 1.15;
      margin: 0 0 10px 0;
      color: var(--ink);
    }

    .muted {
      color: var(--muted-2);
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--status-default-bg);
      color: var(--status-default-text);
      font-size: 12px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 6px 20px;
      margin-top: 26px;
      border-top: 2px solid var(--ink);
      padding-top: 20px;
    }

    .label {
      color: var(--muted-2);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .value {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14.5px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--status-default-bg);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page {
        padding: 32px 20px 56px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .label {
        border-bottom: none;
        padding-bottom: 2px;
      }

      .value {
        padding-top: 0;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

<div class="page">

  <header class="site">
    <div class="brand">
      <a href="https://www.eurosdr.net/" target="_blank" rel="noopener noreferrer">
        <img src="EuroSDR.png" alt="EuroSDR logo" class="logo" />
      </a>
      <div class="brand-divider"></div>
      <div class="brand-tag">Model Registry</div>
    </div>
  </header>

  <div class="topbar">
    <a href="index.html">← Back to index</a>
    <div class="muted" id="metaHint"></div>
  </div>

  <div id="app">
    <div class="muted">Loading...</div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/data-loader.js"></script>
<script>
  (function () {
    const {
      esc,
      textOrDash,
      linkOrDash,
      normalizeModel
    } = window.ModelRegistryUtils;

    const { loadModels } = window.ModelRegistryData;

    function getId() {
      return new URLSearchParams(location.search).get('id');
    }

    function row(label, valueHtml) {
      return `
        <div class="label">${esc(label)}</div>
        <div class="value">${valueHtml}</div>
      `;
    }

    function show(html) {
      document.getElementById('app').innerHTML = html;
    }

    function showError(title, message) {
      document.title = title;
      document.getElementById('metaHint').textContent = '';
      show(`
        <h1>${esc(title)}</h1>
        <p>${esc(message)}</p>
      `);
    }

    function renderModel(model) {
      const m = normalizeModel(model);
      const title = `${m.modelName || m.id || 'Model'} – Detail`;
      document.title = title;

      const hintParts = [];
      if (m.id) hintParts.push(`ID: ${m.id}`);
      if (m.organisation) hintParts.push(`Organisation: ${m.organisation}`);
      if (m.modelStatus) hintParts.push(`Status: ${m.modelStatus}`);
      document.getElementById('metaHint').textContent = hintParts.join(' • ');

      show(`
        <h1>${esc(m.modelName || 'Untitled model')}</h1>
        <div class="muted">
          ${m.id ? `<span class="badge">${esc(m.id)}</span>` : ''}
          ${m.modelStatus ? ` &nbsp;•&nbsp; <span class="badge">${esc(m.modelStatus)}</span>` : ''}
        </div>

        <div class="grid">
          ${row('Model name', textOrDash(m.modelName))}
          ${row('Organisation', textOrDash(m.organisation))}
          ${row('Model Status', textOrDash(m.modelStatus))}
          ${row('AI task', textOrDash(m.aiTask))}
          ${row('Input specification', textOrDash(m.inputSpecification))}
          ${row('Output specification', textOrDash(m.outputSpecification))}
          ${row('Architecture', textOrDash(m.architecture))}
          ${row('Training data origin', textOrDash(m.trainingDataOrigin))}
          ${row('Primary performance metric', textOrDash(m.primaryPerformanceMetric))}
          ${row('License', textOrDash(m.license))}
          ${row('Access link', linkOrDash(m.accessLink))}
          ${row('More Information', textOrDash(m.moreInformation))}
        </div>
      `);
    }

    async function main() {
      try {
        const id = getId();
        if (!id) {
          showError('Not found', 'Missing query parameter: ?id=...');
          return;
        }

        const models = await loadModels();
        const model = models.find((item) => String(item.id) === String(id));

        if (!model) {
          showError('Not found', `No model found for id="${id}".`);
          return;
        }

        renderModel(model);
      } catch (error) {
        console.error(error);
        showError('Error', `A script error stopped the page: ${error?.message || String(error)}`);
      }
    }

    main();
  })();
</script>

</body>
</html>
