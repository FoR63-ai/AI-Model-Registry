<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Model Detail</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background-color: #f1f7f3;
    }

    .wrapper {
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 1100px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
      position: relative;
    }

    .logo {
      position: absolute;
      top: 20px;
      right: 25px;
      height: 65px;
      width: auto;
      cursor: pointer;
    }

    h1 {
      margin: 0 0 6px 0;
      padding-right: 130px;
    }

    .muted {
      color: #666;
      font-size: 13px;
      padding-right: 130px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 8px;
      background: #eef5f0;
      font-size: 12px;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .label {
      color: #666;
      font-size: 13px;
    }

    .value {
      white-space: pre-wrap;
      line-height: 1.35;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 22px 0;
    }

    a {
      text-decoration: none;
      color: #2f6f4f;
    }

    a:hover {
      text-decoration: underline;
    }

    code {
      background: #f6f6f6;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .left-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1,
      .muted {
        padding-right: 0;
      }

      .logo {
        position: static;
        display: block;
        margin: 0 0 16px auto;
      }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="card">

    <a href="https://www.eurosdr.net/" target="_blank" rel="noopener noreferrer">
      <img src="EuroSDR.png" alt="EuroSDR logo" class="logo" />
    </a>

    <div class="topbar">
      <div class="left-actions">
        <a href="index.html">← Back to index</a>
      </div>
      <div class="muted" id="metaHint"></div>
    </div>

    <div id="app">
      <div class="muted" style="padding-right:0;">Loading...</div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/data-loader.js"></script>
<script>
  (function () {
    const {
      esc,
      textOrDash,
      linkOrDash,
      normalizeModel
    } = window.ModelRegistryUtils;

    const { loadModels } = window.ModelRegistryData;

    function getId() {
      return new URLSearchParams(location.search).get('id');
    }

    function row(label, valueHtml) {
      return `
        <div class="label">${esc(label)}</div>
        <div class="value">${valueHtml}</div>
      `;
    }

    function show(html) {
      document.getElementById('app').innerHTML = html;
    }

    function showError(title, message) {
      document.title = title;
      document.getElementById('metaHint').textContent = '';
      show(`
        <h1>${esc(title)}</h1>
        <p>${esc(message)}</p>
      `);
    }

    function renderModel(model) {
      const m = normalizeModel(model);
      const title = `${m.modelName || m.id || 'Model'} – Detail`;
      document.title = title;

      const hintParts = [];
      if (m.id) hintParts.push(`ID: ${m.id}`);
      if (m.organisation) hintParts.push(`Organisation: ${m.organisation}`);
      if (m.modelStatus) hintParts.push(`Status: ${m.modelStatus}`);
      document.getElementById('metaHint').textContent = hintParts.join(' • ');

      show(`
        <h1>${esc(m.modelName || 'Untitled model')}</h1>
        <div class="muted">
          ${m.id ? `<span class="badge">${esc(m.id)}</span>` : ''}
          ${m.modelStatus ? ` &nbsp;•&nbsp; <span class="badge">${esc(m.modelStatus)}</span>` : ''}
        </div>

        <div class="grid">
          ${row('Model name', textOrDash(m.modelName))}
          ${row('Organisation', textOrDash(m.organisation))}
          ${row('Model Status', textOrDash(m.modelStatus))}
          ${row('AI task', textOrDash(m.aiTask))}
          ${row('Input specification', textOrDash(m.inputSpecification))}
          ${row('Output specification', textOrDash(m.outputSpecification))}
          ${row('Architecture', textOrDash(m.architecture))}
          ${row('Training data origin', textOrDash(m.trainingDataOrigin))}
          ${row('Primary performance metric', textOrDash(m.primaryPerformanceMetric))}
          ${row('License', textOrDash(m.license))}
          ${row('Access link', linkOrDash(m.accessLink))}
          ${row('More Information', textOrDash(m.moreInformation))}
        </div>
      `);
    }

    async function main() {
      try {
        const id = getId();
        if (!id) {
          showError('Not found', 'Missing query parameter: ?id=...');
          return;
        }

        const models = await loadModels();
        const model = models.find((item) => String(item.id) === String(id));

        if (!model) {
          showError('Not found', `No model found for id="${id}".`);
          return;
        }

        renderModel(model);
      } catch (error) {
        console.error(error);
        showError('Error', `A script error stopped the page: ${error?.message || String(error)}`);
      }
    }

    main();
  })();
</script>

</body>
</html>
